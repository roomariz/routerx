name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build & Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci:check

      - name: Ensure artifacts directory
        run: mkdir -p artifacts

      - name: Capture RouterX metrics snapshot
        run: npm run ci:metrics

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routerx-metrics
          path: artifacts/routerx-metrics.json
          retention-days: 14
